# MySQL. Versions 5.6.4 and up are supported.
#
# Connection settings come from environment variables so that no password is
# ever committed to git. For local development, set them in your shell, e.g.:
#
#   export DB_USERNAME=root
#   export DB_PASSWORD=...
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>
  variables:
    # Reject invalid data (e.g. too-long strings, bad dates) instead of silently truncating it.
    sql_mode: TRADITIONAL

development:
  <<: *default
  database: nutri_calc_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: nutri_calc_test

# In production, provide the password via the NUTRI_CALC_DATABASE_PASSWORD
# environment variable (or a full DATABASE_URL). Never store it in this file.
production:
  primary: &primary_production
    <<: *default
    database: nutri_calc_production
    username: nutri_calc
    password: <%= ENV["NUTRI_CALC_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: nutri_calc_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: nutri_calc_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: nutri_calc_production_cable
    migrations_paths: db/cable_migrate
